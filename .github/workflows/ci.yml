name: CI Tests

on:
  push:
    branches:
      - '**'

permissions:
  contents: read
  security-events: read

jobs:
  test-javascript:
    name: Run JavaScript Tests (aa-lwc)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: '20'

      - name: Install Dependencies
        working-directory: salesforce/aa-lwc
        run: npm ci

      - name: Run Tests
        working-directory: salesforce/aa-lwc
        run: npm test

  test-python-pubsub:
    name: Run Python Tests (PubSub Interceptor)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install dependencies
        working-directory: aa-integration-backend/cloud-pubsub-interceptor
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Run Tests
        working-directory: aa-integration-backend/cloud-pubsub-interceptor
        run: pytest unit_test.py

  test-python-ui-connector:
    name: Run Python Tests (UI Connector)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install dependencies
        working-directory: aa-integration-backend/ui-connector
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Run Tests
        working-directory: aa-integration-backend/ui-connector
        env:
          GCP_PROJECT_ID: fake_project_id
        run: pytest unit_test.py

  test-python-genesys:
    name: Run Python Tests (Genesys Audiohook)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install dependencies
        working-directory: genesyscloud/genesyscloud-audiohook
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Run Tests
        working-directory: genesyscloud/genesyscloud-audiohook
        run: pytest test_dialogflow_api.py
